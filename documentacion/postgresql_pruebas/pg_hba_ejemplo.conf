# NeuroMedX Connect
# Reglas de aislamiento del usuario de pruebas.
#
# Insertar antes de las reglas generales de pg_hba.conf.
# Conservar las reglas existentes de la instancia.
# Realizar un respaldo antes de modificar el archivo.

# Permitir exclusivamente la base de pruebas local.
local   neuromedx_connect_test   neuromedx_test                    scram-sha-256
host    neuromedx_connect_test   neuromedx_test   127.0.0.1/32     scram-sha-256
host    neuromedx_connect_test   neuromedx_test   ::1/128          scram-sha-256

# Rechazar cualquier otra conexion del usuario de pruebas.
local   all                     neuromedx_test                    reject
host    all                     neuromedx_test   0.0.0.0/0        reject
host    all                     neuromedx_test   ::/0             reject
